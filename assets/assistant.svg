<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="astGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="80" cy="80" r="70" fill="url(#haloGrad)" opacity="0.7" />

  <!-- Robot Body / Torso -->
  <rect x="48" y="98" width="64" height="42" rx="18" fill="url(#astGrad)" filter="url(#softGlow)" />
  <circle cx="80" cy="116" r="10" fill="#FFFFFF" opacity="0.8" />
  <path d="M76 116 L84 116 M80 112 L80 120" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cute Robot Arms -->
  <path d="M48 108 C36 112 34 122 42 128" stroke="#3B82F6" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="42" cy="128" r="5" fill="#60A5FA" />
  <!-- Waving Right Hand -->
  <path d="M112 108 C124 102 128 88 122 78" stroke="#8B5CF6" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="122" cy="78" r="5.5" fill="#A78BFA" />

  <!-- Robot Head -->
  <rect x="38" y="38" width="84" height="64" rx="24" fill="url(#astGrad)" filter="url(#softGlow)" />

  <!-- Antenna -->
  <line x1="80" y1="38" x2="80" y2="24" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" />
  <circle cx="80" cy="20" r="6" fill="#F59E0B" />
  <circle cx="80" cy="20" r="2.5" fill="#FEF3C7" />

  <!-- Screen Face -->
  <rect x="47" y="47" width="66" height="46" rx="15" fill="#FFFFFF" />

  <!-- Eyes - Expressive & Bright -->
  <ellipse cx="63" cy="67" rx="7" ry="8" fill="#2563EB" />
  <ellipse cx="97" cy="67" rx="7" ry="8" fill="#2563EB" />
  <circle cx="65.5" cy="64.5" r="3" fill="#FFFFFF" />
  <circle cx="99.5" cy="64.5" r="3" fill="#FFFFFF" />
  <circle cx="61.5" cy="71" r="1.5" fill="#93C5FD" />
  <circle cx="95.5" cy="71" r="1.5" fill="#93C5FD" />

  <!-- Blushing Cheeks -->
  <ellipse cx="55" cy="75" rx="4" ry="2.5" fill="#F472B6" opacity="0.6" />
  <ellipse cx="105" cy="75" rx="4" ry="2.5" fill="#F472B6" opacity="0.6" />

  <!-- Warm Smile -->
  <path d="M72 76 Q80 84 88 76" stroke="#2563EB" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Academic Glasses/Badge accent -->
  <path d="M80 34 L96 42 L80 50 L64 42 Z" fill="#2563EB" opacity="0.15" />
</svg>