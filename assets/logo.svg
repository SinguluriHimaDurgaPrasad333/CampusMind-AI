<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Bot Body / Head Base -->
  <rect x="20" y="38" width="60" height="46" rx="16" fill="url(#botGrad)" filter="url(#softShadow)" />

  <!-- Robot Face Screen -->
  <rect x="27" y="45" width="46" height="32" rx="10" fill="#FFFFFF" />

  <!-- Eyes - Friendly Happy Arcs -->
  <circle cx="39" cy="59" r="4.5" fill="#2563EB" />
  <circle cx="61" cy="59" r="4.5" fill="#2563EB" />
  <circle cx="41" cy="57" r="1.5" fill="#FFFFFF" />
  <circle cx="63" cy="57" r="1.5" fill="#FFFFFF" />

  <!-- Smile -->
  <path d="M44 67 Q50 72 56 67" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Cheeks -->
  <circle cx="33" cy="64" r="2.5" fill="#F472B6" opacity="0.6" />
  <circle cx="67" cy="64" r="2.5" fill="#F472B6" opacity="0.6" />

  <!-- Graduation Cap (Mortarboard) -->
  <path d="M50 14 L85 27 L50 40 L15 27 Z" fill="url(#capGrad)" filter="url(#softShadow)" />
  <polygon points="50,14 85,27 50,40 15,27" fill="url(#capGrad)" />
  <path d="M30 33 L30 42 C30 46 70 46 70 42 L70 33" fill="#1D4ED8" />

  <!-- Tassel -->
  <circle cx="50" cy="27" r="2.5" fill="#F59E0B" />
  <path d="M50 27 Q74 29 76 43" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <rect x="73.5" y="42" width="5" height="7" rx="2" fill="#D97706" />
</svg>