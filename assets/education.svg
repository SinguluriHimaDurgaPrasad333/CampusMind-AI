<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#F5F3FF" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Soft Bubble -->
  <rect x="20" y="20" width="480" height="340" rx="28" fill="url(#bgGrad)" filter="url(#soft)" />

  <!-- Floating Sparkles / Knowledge Particles -->
  <circle cx="80" cy="80" r="4" fill="#60A5FA" opacity="0.8" />
  <circle cx="430" cy="90" r="5" fill="#A78BFA" opacity="0.7" />
  <circle cx="110" cy="280" r="3" fill="#34D399" opacity="0.8" />
  <circle cx="450" cy="270" r="4" fill="#F59E0B" opacity="0.7" />

  <!-- University Building Outline in Light Blueprint -->
  <path d="M70 210 L70 290 L170 290 L170 210 L120 175 Z" fill="#DBEAFE" opacity="0.6" />
  <rect x="88" y="230" width="14" height="20" rx="3" fill="#BFDBFE" />
  <rect x="112" y="230" width="14" height="20" rx="3" fill="#BFDBFE" />
  <rect x="136" y="230" width="14" height="20" rx="3" fill="#BFDBFE" />
  <rect x="110" y="260" width="18" height="30" rx="2" fill="#93C5FD" />
  <!-- Pillar Columns -->
  <line x1="85" y1="210" x2="85" y2="290" stroke="#93C5FD" stroke-width="2" />
  <line x1="155" y1="210" x2="155" y2="290" stroke="#93C5FD" stroke-width="2" />

  <!-- Stack of Colorful Books on Desk -->
  <!-- Book 1 (Bottom Green) -->
  <rect x="340" y="265" width="110" height="22" rx="4" fill="url(#book3)" />
  <rect x="340" y="267" width="15" height="18" rx="2" fill="#A7F3D0" />
  <!-- Book 2 (Middle Purple) -->
  <rect x="345" y="240" width="100" height="22" rx="4" fill="url(#book2)" />
  <rect x="345" y="242" width="15" height="18" rx="2" fill="#DDD6FE" />
  <!-- Book 3 (Top Blue) -->
  <rect x="352" y="215" width="90" height="22" rx="4" fill="url(#book1)" />
  <rect x="352" y="217" width="14" height="18" rx="2" fill="#BAE6FD" />

  <!-- Graduation Cap Floating Above Books -->
  <path d="M397 155 L445 172 L397 189 L349 172 Z" fill="#2563EB" filter="url(#soft)" />
  <path d="M365 180 L365 192 C365 197 429 197 429 192 L429 180" fill="#1D4ED8" />
  <circle cx="397" cy="172" r="3" fill="#F59E0B" />
  <path d="M397 172 Q430 178 434 196" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" fill="none" />
  <rect x="431" y="194" width="6" height="8" rx="2" fill="#D97706" />

  <!-- Central Student Figure Working on Laptop -->
  <!-- Desk Base Line -->
  <line x1="160" y1="290" x2="360" y2="290" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />

  <!-- Student Body -->
  <ellipse cx="230" cy="275" rx="35" ry="30" fill="#2563EB" />
  <circle cx="230" cy="180" r="24" fill="#FCD34D" /> <!-- Head -->
  <!-- Student Hair -->
  <path d="M208 178 C208 155 252 155 252 178 C242 165 220 165 208 178 Z" fill="#1E293B" />
  <!-- Student Glasses -->
  <circle cx="223" cy="180" r="6" stroke="#1E293B" stroke-width="2" fill="none" />
  <circle cx="237" cy="180" r="6" stroke="#1E293B" stroke-width="2" fill="none" />
  <line x1="229" y1="180" x2="231" y2="180" stroke="#1E293B" stroke-width="2" />
  <!-- Student Smile -->
  <path d="M226 193 Q230 197 234 193" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Laptop on Desk -->
  <rect x="250" y="215" width="70" height="50" rx="6" fill="#1E293B" />
  <rect x="254" y="219" width="62" height="42" rx="3" fill="#FFFFFF" />
  <!-- Screen Content: Code & Chat lines -->
  <rect x="258" y="224" width="30" height="4" rx="2" fill="#3B82F6" />
  <rect x="258" y="232" width="46" height="3" rx="1.5" fill="#93C5FD" />
  <rect x="258" y="238" width="38" height="3" rx="1.5" fill="#A78BFA" />
  <rect x="258" y="244" width="42" height="3" rx="1.5" fill="#6EE7B7" />
  <circle cx="304" cy="252" r="5" fill="#3B82F6" />
  <!-- Laptop Base -->
  <polygon points="240,268 330,268 338,274 232,274" fill="#94A3B8" />

  <!-- AI Companion Floating Near Student -->
  <!-- Cute Floating AI Drone / Robot with graduation aura -->
  <g transform="translate(185, 45)">
    <circle cx="70" cy="50" r="36" fill="#EDE9FE" />
    <rect x="46" y="26" width="48" height="38" rx="14" fill="#7C3AED" />
    <rect x="52" y="32" width="36" height="26" rx="8" fill="#FFFFFF" />
    <!-- AI Eyes -->
    <circle cx="63" cy="44" r="3.5" fill="#7C3AED" />
    <circle cx="77" cy="44" r="3.5" fill="#7C3AED" />
    <!-- AI Smile -->
    <path d="M66 50 Q70 54 74 50" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Little Antenna -->
    <line x1="70" y1="26" x2="70" y2="16" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" />
    <circle cx="70" cy="14" r="4" fill="#F59E0B" />
    <!-- Speech Bubble with Lightbulb / Checkmark -->
    <path d="M96 22 L112 14 C116 12 122 16 122 22 L122 36 C122 40 118 44 114 44 L102 44 L94 50 L96 42 Z" fill="#2563EB" />
    <path d="M104 28 L108 32 L114 24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Verified Badge / Shield -->
  <g transform="translate(65, 95)">
    <rect x="0" y="0" width="55" height="55" rx="14" fill="#FFFFFF" filter="url(#soft)" />
    <circle cx="27.5" cy="27.5" r="18" fill="#D1FAE5" />
    <path d="M21 28 L25 32 L34 22" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Query Pill Graphic -->
  <g transform="translate(325, 80)">
    <rect x="0" y="0" width="130" height="36" rx="18" fill="#FFFFFF" filter="url(#soft)" />
    <circle cx="18" cy="18" r="8" fill="#DBEAFE" />
    <path d="M15 18 L21 18 M18 15 L18 21" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
    <text x="35" y="23" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E293B">Syllabus &amp; Rules</text>
  </g>
</svg>